name: ufs-unidade2
x-java: &java
  image: ufs-transferencia:local
  volumes:
    - dados:/dados
  networks: [experimento]
  mem_limit: 256m
x-transmission: &transmission
  image: ufs-transmission:3.00
  volumes:
    - dados:/dados
  networks: [experimento]
  mem_limit: 128m
services:
  servidor:
    build: .
    <<: *java
    command: [servidor]
  tracker:
    <<: *java
    command: [tracker]
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.transmission
    <<: *transmission
  cliente1:
    <<: *java
    command: [cliente, "1"]
  peer1:
    <<: *transmission
  cliente2:
    <<: *java
    command: [cliente, "2"]
  peer2:
    <<: *transmission
  cliente3:
    <<: *java
    command: [cliente, "3"]
  peer3:
    <<: *transmission
  cliente4:
    <<: *java
    command: [cliente, "4"]
  peer4:
    <<: *transmission
  cliente5:
    <<: *java
    command: [cliente, "5"]
  peer5:
    <<: *transmission
  cliente6:
    <<: *java
    command: [cliente, "6"]
  peer6:
    <<: *transmission
  cliente7:
    <<: *java
    command: [cliente, "7"]
  peer7:
    <<: *transmission
  cliente8:
    <<: *java
    command: [cliente, "8"]
  peer8:
    <<: *transmission
  executor:
    <<: *java
    profiles: [ferramentas]
    command: [testar]
    environment:
      POOL_N: ${POOL_N:-2}
      UPLOAD_BPS: ${UPLOAD_BPS:-25000000}
    volumes:
      - dados:/dados
      - ./resultados:/resultados
      - ./relatorio:/relatorio
    depends_on:
      - servidor
      - tracker
      - seed
      - cliente1
      - cliente2
      - cliente3
      - cliente4
      - cliente5
      - cliente6
      - cliente7
      - cliente8
      - peer1
      - peer2
      - peer3
      - peer4
      - peer5
      - peer6
      - peer7
      - peer8
networks:
  experimento:
    internal: true
volumes:
  dados:
